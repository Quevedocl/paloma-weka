<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paloma">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Paloma Weka</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Indie+Flower&family=Kalam:wght@400;700&family=Patrick+Hand&family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@500;700&family=Special+Elite&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --madera:#4a3120; --madera2:#33210f; --perg:#ecd9a9; --perg2:#dcc088; --tinta:#3a2716;
  --lacre:#8e2b1c; --lacre2:#b13a26; --sombra:rgba(30,15,5,.45);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(circle at 30% 20%,#5b3d27,var(--madera2));
  font-family:'IM Fell English',Georgia,serif;color:var(--tinta);
  display:flex;justify-content:center;
}
#app{
  position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;
  background:
    radial-gradient(ellipse at 20% 10%,rgba(255,244,210,.55),transparent 55%),
    radial-gradient(ellipse at 90% 95%,rgba(120,80,30,.35),transparent 50%),
    repeating-linear-gradient(97deg,rgba(120,80,30,.05) 0 2px,transparent 2px 7px),
    var(--perg);
  box-shadow:0 0 60px #0008;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
@media(min-width:500px){#app{height:min(900px,96vh);align-self:center;border-radius:28px;border:10px solid var(--madera2)}}
.screen{position:absolute;inset:0;padding:26px 24px;display:none;flex-direction:column;gap:18px;overflow-y:auto}
.screen.on{display:flex}
h1{font-family:'Caveat',cursive;font-size:44px;line-height:1;font-weight:700}
h2{font-family:'Caveat',cursive;font-size:32px;font-weight:700}
p{line-height:1.5;font-size:18px}
.muted{opacity:.7;font-size:16px}
label{font-size:17px;display:block;margin-bottom:6px}
input,textarea{
  width:100%;font:inherit;font-size:20px;color:var(--tinta);background:rgba(255,248,225,.55);
  border:none;border-bottom:2px solid var(--madera);padding:10px 6px;border-radius:4px 4px 0 0;outline:none;
}
input:focus,textarea:focus{background:rgba(255,248,225,.85);border-bottom-color:var(--lacre)}
button{font:inherit;cursor:pointer}
.btn{
  background:var(--lacre);color:#fbeed0;border:none;border-radius:999px;padding:13px 24px;font-size:20px;
  box-shadow:0 3px 0 #5e1a10,0 6px 14px var(--sombra);transition:transform .12s;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5e1a10}
.btn.suave{background:transparent;color:var(--tinta);border:2px solid var(--madera);box-shadow:none}
.link{background:none;border:none;text-decoration:underline;color:var(--tinta);opacity:.7;font-size:15px;align-self:center}
.btn:focus-visible,.link:focus-visible,.carta:focus-visible{outline:3px solid var(--lacre);outline-offset:3px}
.fila{display:flex;gap:12px}
.fila>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.aviso{font-size:14px;background:rgba(142,43,28,.12);border-left:3px solid var(--lacre);padding:8px 10px;border-radius:0 6px 6px 0}
 
.fcol{display:flex;flex-direction:column;gap:18px}
/* Buzón */
#lista{display:flex;flex-direction:column;gap:12px;flex:1}
.carta{
  position:relative;display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:linear-gradient(160deg,#f3e3b8,#e2c891);border:1px solid #b8955a;border-radius:6px 14px 6px 14px;
  padding:14px 16px;color:var(--tinta);box-shadow:2px 4px 10px var(--sombra);
}
.carta:nth-child(even){transform:rotate(.7deg)}.carta:nth-child(odd){transform:rotate(-.6deg)}
.carta.destacada{border:2px solid #c78b3c;background:linear-gradient(160deg,#faedcb,#e6ce9a)}
.estrella-btn{background:none;border:none;font-size:22px;cursor:pointer;padding:4px;margin-left:auto;opacity:.4;transition:.2s}
.estrella-btn.activo{opacity:1;transform:scale(1.1)}
.lacre{
  flex:none;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--lacre2),var(--lacre));
  box-shadow:inset 0 -3px 5px #0004,0 2px 4px #0005;display:grid;place-items:center;color:#f5d9a8;font-family:'Caveat',cursive;font-size:22px;
}
.carta b{font-family:'Caveat',cursive;font-size:26px;display:block;line-height:1}
.carta small{opacity:.7;font-size:14px}
.vacio{margin:auto;text-align:center;opacity:.75}
.vacio svg{width:110px;opacity:.6;margin-bottom:8px}
 
/* Redacción */
.hoja{
  flex:1;display:flex;flex-direction:column;background:#f6e9c4;border:1px solid #b8955a;border-radius:4px;
  box-shadow:2px 5px 14px var(--sombra);padding:14px 16px;min-height:0;
}
.hoja textarea{
  flex:1;resize:none;border:none;background:transparent;font-family:'Caveat',cursive;font-size:28px;line-height:36px;
  background-image:repeating-linear-gradient(transparent 0 35px,rgba(120,80,30,.28) 35px 36px);
  background-attachment:local;padding:0 2px;
}
.hoja textarea:focus{background-color:transparent}
 
/* Controles de Estilo de Carta */
.controles-estilo{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.controles-estilo select{font-size:15px;padding:4px;border-radius:4px;border:1px solid #b8955a;background:#fff8e1}
.controles-estilo button{background:#e2c891;border:1px solid #b8955a;border-radius:4px;padding:4px 10px;font-weight:bold}
 
/* Lectura */
.pergamino{
  flex:1;position:relative;padding:88px 26px 28px;overflow-y:auto;min-height:0;
  background:
    radial-gradient(ellipse at 50% 0,rgba(255,250,230,.7),transparent 60%),
    linear-gradient(#f2e2b4,#e6cd97);
  border-top:14px solid var(--madera);border-bottom:14px solid var(--madera);
  box-shadow:0 8px 20px var(--sombra);
  transform-origin:top;animation:abrir .7s .55s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes abrir{from{transform:scaleY(.05);opacity:0}to{transform:scaleY(1);opacity:1}}
.pergamino .de{font-family:'Caveat',cursive;font-size:30px;margin-bottom:14px;color:var(--lacre)}
.pergamino .texto{font-family:'Caveat',cursive;font-size:29px;line-height:1.3;white-space:pre-wrap;word-break:break-word}
 
select{width:100%;font:inherit;font-size:22px;font-family:'Caveat',cursive;color:var(--tinta);background:rgba(255,248,225,.55);border:none;border-bottom:2px solid var(--madera);padding:8px 4px;border-radius:4px 4px 0 0}
.usr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed #b8955a}
.usr>div{flex:1;min-width:0}
.usr b{font-family:'Caveat',cursive;font-size:26px;line-height:1}
.usr small{display:block;opacity:.7;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.usr .btn{padding:7px 14px;font-size:16px;flex:none}
.aviso.ok{background:rgba(60,110,50,.14);border-left-color:#3c6e32}
 
/* Vuelo General de Salida */
#vuelo{position:absolute;inset:0;z-index:20;display:none;background:rgba(236,217,169,.9);overflow:hidden}
#vuelo.on{display:block}
#vuelo svg{position:absolute;left:0;bottom:0;width:150px;animation:vuela 2.6s cubic-bezier(.45,.05,.55,.95) forwards}
#vuelo p{position:absolute;bottom:14%;width:100%;text-align:center;font-family:'Caveat',cursive;font-size:32px;animation:aparece 2.6s forwards}
@keyframes vuela{
  0%{transform:translate(-60px,40px) rotate(-8deg) scale(.8)}
  50%{transform:translate(150px,-330px) rotate(-14deg) scale(1)}
  100%{transform:translate(470px,-720px) rotate(-18deg) scale(.6)}
}
@keyframes aparece{0%{opacity:0}25%,70%{opacity:1}100%{opacity:0}}
 
/* Escena de lectura: pergamino + paloma se mueven juntos */
.escena{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#paloma-lectura{position:absolute;top:22px;left:14px;width:92px;z-index:10;pointer-events:none}
#paloma-lectura .ala{animation:none}
/* 1. Llegada: entra desde arriba a la izquierda, se acerca (zoom) y se posa */
#paloma-lectura.acercandose{animation:acercarPaloma 1.3s cubic-bezier(.2,.8,.25,1) both}
#paloma-lectura.acercandose .ala,#paloma-lectura.se-va .ala,.escena.guardando #paloma-lectura .ala{animation:aletea .32s ease-in-out infinite alternate}
@keyframes acercarPaloma{
  0%{transform:translate(-140px,-170px) scale(.15) rotate(-25deg);opacity:0}
  15%{opacity:1}
  65%{transform:translate(20px,10px) scale(1.5) rotate(4deg)}
  100%{transform:none;opacity:1}
}
/* 2. Guardar: la paloma se eleva llevándose la carta */
.escena.guardando{animation:llevaCarta 1.1s cubic-bezier(.5,0,.9,.5) forwards}
@keyframes llevaCarta{to{transform:translateY(-115%) rotate(3deg)}}
/* 3. Se va: el pergamino se cierra y la paloma se aleja al centro con punto de fuga */
.escena.cierra .pergamino{animation:cerrarPerg .6s ease-in forwards}
@keyframes cerrarPerg{to{transform:scaleY(.04);opacity:0}}
#paloma-lectura.se-va{animation:puntoFuga 1.2s cubic-bezier(.55,0,.85,.45) forwards}
@keyframes puntoFuga{
  0%{transform:none;opacity:1}
  20%{transform:translate(-8px,-14px) scale(1.15) rotate(-8deg)}
  100%{transform:translate(var(--dx),var(--dy)) scale(.03) rotate(6deg);opacity:0}
}
 
.ala{transform-origin:52px 50px;animation:aletea .32s ease-in-out infinite alternate}
@keyframes aletea{from{transform:rotate(-16deg) scaleY(1)}to{transform:rotate(14deg) scaleY(.55)}}
 
#toast{
  position:absolute;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;z-index:30;pointer-events:none;
  background:var(--madera2);color:#f5e3b8;padding:11px 20px;border-radius:999px;font-size:17px;white-space:nowrap;transition:.35s;
}
#toast.on{transform:translate(-50%,0);opacity:1}
@media(prefers-reduced-motion:reduce){#vuelo svg,.ala,.pergamino,.escena,#paloma-lectura{animation-duration:.01s!important}}
 
/* ===== Mejoras estéticas ===== */
#app::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 .45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
h1{text-shadow:1px 2px 0 rgba(255,244,210,.7),2px 4px 8px rgba(74,49,32,.25)}
.btn{transition:transform .12s,filter .2s}.btn:hover{filter:brightness(1.08)}
.paloma-auth{width:120px;display:block;margin:0 auto 4px;animation:flota 3.2s ease-in-out infinite}
.paloma-auth .ala{animation:aletea .9s ease-in-out infinite alternate}
.vacio svg{animation:flota 3s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-9px) rotate(-2deg)}}
.filtros{display:flex;gap:8px;overflow-x:auto;flex:none;padding-bottom:2px}
.chip{background:transparent;border:2px solid var(--madera);color:var(--tinta);border-radius:999px;padding:6px 14px;font-size:16px;white-space:nowrap;transition:.2s}
.chip.on{background:var(--madera);color:#f5e3b8}
.carta{animation:entra .5s calc(var(--i,0) * 70ms) both;transition:box-shadow .2s}
@keyframes entra{from{opacity:0;translate:0 18px}}
.carta.nueva{box-shadow:0 0 0 2px rgba(142,43,28,.4),2px 4px 10px var(--sombra)}
.carta.nueva .lacre{animation:latido 1.6s ease-in-out infinite}
.carta.nueva b::after{content:' · nueva';font-size:18px;color:var(--lacre)}
@keyframes latido{50%{transform:scale(1.14)}}
.pergamino .texto{animation:tinta 1.3s 1.5s both}
@keyframes tinta{from{opacity:0;filter:blur(3px)}}
.pergamino.tema-claro{background:linear-gradient(#fbf7ea,#f1ead6)}
.pergamino.tema-noche{background:linear-gradient(#2b2219,#1b140d);color:#ecd9a9}
.pergamino.tema-noche .de{color:#f0a290}
.controles-estilo select{flex:1;min-width:0;width:auto}
.controles-estilo button{min-width:38px}
.contador{text-align:right;font-size:14px;opacity:.6;padding-top:4px}.contador.alto{color:var(--lacre);opacity:1}
.pluma{position:absolute;top:-30px;z-index:25;pointer-events:none;opacity:.85;animation:cae 4s ease-in forwards}
@keyframes cae{to{transform:translate(var(--x),105vh) rotate(var(--r))}}

/* Instantáneas */
.pestana{flex:1;background:transparent;border:2px solid var(--madera);color:var(--tinta);border-radius:999px;padding:7px 12px;font-size:17px;white-space:nowrap;transition:.2s}
.pestana.on{background:var(--madera);color:#f5e3b8}
#bSnap{font-style:normal;color:var(--lacre);font-weight:700}.pestana.on #bSnap{color:#f0a290}
#buscar{font-size:17px;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;flex:1}
.grid .vacio{grid-column:1/-1}
.thumb{position:relative;aspect-ratio:1;border:none;padding:0;border-radius:6px 14px 6px 14px;overflow:hidden;background:#33210f;box-shadow:2px 4px 10px var(--sombra)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.nueva img{filter:blur(14px) brightness(.8);transform:scale(1.15)}
.thumb span{position:absolute;top:6px;left:8px;font-size:15px;color:#fbeed0;text-shadow:0 1px 3px #000}
.thumb small{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:13px;color:#fbeed0;background:linear-gradient(transparent,#000a);text-align:left}
.foto{flex:1;min-height:0;display:grid;place-items:center;border:2px dashed var(--madera);border-radius:10px;overflow:hidden;text-align:center;padding:12px;cursor:pointer}
.foto img{width:100%;height:100%;object-fit:contain;max-height:100%}
#s-ver{padding:0;gap:0;background:#1b140d;color:#ecd9a9}
#vimg{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
#vbar{padding:14px 20px 18px;display:flex;flex-direction:column;gap:12px}
#vde{font-family:'Caveat',cursive;font-size:26px}#vpie{font-family:'Caveat',cursive;font-size:28px;color:#fff}
.reacc{display:flex;justify-content:space-between}
.reacc button{background:none;border:2px solid transparent;font-size:28px;border-radius:50%;padding:4px}
.reacc button.on{border-color:#f0a290;background:#ffffff18}
#s-ver .btn.suave{color:#ecd9a9;border-color:#ecd9a9}
/* Pluma compartida */
.pluma-viva{flex:none;background:rgba(255,248,225,.7);border:1px dashed #b8955a;border-radius:8px;padding:8px 12px}
#plumaQuien{font-family:'Caveat',cursive;font-size:22px;color:var(--lacre)}
#plumaQuien::before{content:'🪶 ';display:inline-block;animation:escribe 1s ease-in-out infinite alternate}
@keyframes escribe{to{transform:rotate(-20deg) translateY(-2px)}}
#plumaTexto{max-height:96px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;line-height:1.25;margin-top:4px}
#ePluma.off{opacity:.4}
@media(prefers-reduced-motion:reduce){#plumaQuien::before{animation:none}}
/* Configuración, papeles, lienzo */
.cfgsec{display:flex;flex-direction:column;gap:10px;border-bottom:1px dashed #b8955a;padding-bottom:14px}
.opc{display:flex;gap:8px;flex-wrap:wrap}.opc button{width:42px;height:42px;border-radius:50%;border:3px solid transparent;font-size:20px;background:#e2c891}
.opc button.on{border-color:var(--tinta)}
.papel-claro{background:linear-gradient(#fbf7ea,#f1ead6)!important}
.papel-noche{background:linear-gradient(#2b2219,#1b140d)!important;color:#ecd9a9}.papel-noche textarea{color:#ecd9a9}.papel-noche .de{color:#f0a290}
.papel-cuadros{background:#fbf7ea repeating-linear-gradient(0deg,transparent 0 23px,#9bb7d466 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,#9bb7d466 23px 24px)!important}
.papel-flores{background:radial-gradient(circle at 20px 20px,#e79ab466 6px,transparent 7px) 0 0/60px 60px,radial-gradient(circle at 50px 48px,#f5c86a77 5px,transparent 6px) 0 0/60px 60px,#fdf3ee!important}
#s-escribir .hoja{min-height:230px}
#extras{background:rgba(255,248,225,.5);border:1px solid #b8955a;border-radius:8px;padding:8px 12px}
#extras summary{font-size:18px;cursor:pointer}#extras>*{margin-top:10px}
#extras input[type=date],#extras select{font-size:18px}
.herr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.herr button{min-width:34px;height:34px;border-radius:50%;border:2px solid #b8955a;font-size:15px;padding:0 6px}
.herr.txt button{border-radius:999px;background:#e2c891;padding:0 12px}
canvas.lz{max-width:100%;max-height:52vh;width:auto;height:auto;margin:0 auto;display:block;touch-action:none;background:#fbf7ea;border-radius:8px}
#cvGar{width:100%;max-height:none;background:#fbf7ea}
.carta.sellada{opacity:.85}
.pergamino img.gar{max-width:100%;margin-top:14px;border-radius:6px}
.pergamino .ps{font-family:'Caveat',cursive;font-size:26px;margin-top:14px;color:var(--lacre)}
.mes{grid-column:1/-1;font-family:'Caveat',cursive;font-size:26px;text-transform:capitalize}
</style>
</head>
<body>
<div id="app">
 
  <!-- 1. Acceso -->
  <section class="screen" id="s-auth">
    <div style="margin-top:5vh"><h1>Paloma Weka</h1></div>
    <p>Cartas que llegan volando. Se leen y se van.</p>
    <form id="formAuth" class="fcol" novalidate>
      <div id="campoNombre" hidden><label for="nombre">Tu nombre</label><input id="nombre" name="name" maxlength="30" autocomplete="name"></div>
      <div><label for="email">Correo</label><input id="email" name="username" type="email" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off"></div>
      <div><label for="clave">Contraseña</label><input id="clave" name="password" type="password" minlength="6" autocomplete="current-password"></div>
      <div class="aviso" id="msg" hidden></div>
      <button class="btn" id="entrar" type="submit">Entrar</button>
      <button class="link" id="cambiarModo" type="button">¿No tienes cuenta? Regístrate</button>
      <button class="link" id="olvide" type="button">Olvidé mi contraseña</button>
    </form>
  </section>
 
  <!-- Nueva contraseña -->
  <section class="screen" id="s-nueva">
    <div style="margin-top:5vh"><h2>Nueva contraseña</h2></div>
    <p>Elige la contraseña con la que entrarás desde ahora.</p>
    <form id="formNueva" class="fcol" novalidate>
      <div><label for="nuevoUsuario">Correo</label><input id="nuevoUsuario" name="username" type="email" autocomplete="username" readonly></div>
      <div><label for="clave2">Nueva contraseña</label><input id="clave2" name="password" type="password" minlength="6" autocomplete="new-password"></div>
      <div class="aviso" id="msg2" hidden></div>
      <button class="btn" type="submit">Guardar contraseña</button>
      <button class="link" id="cancelarClave" type="button">Cancelar</button>
    </form>
  </section>
 
  <!-- 2. Buzón -->
  <section class="screen" id="s-buzon">
    <div class="top">
      <div><h1 id="saludo">Buzón</h1><p class="muted" id="sub"></p></div>
      <button class="link" id="btnCfg" aria-label="Configuración" style="font-size:30px;opacity:1;text-decoration:none">⚙️</button>
    </div>
    <div class="filtros" id="tabs"><button class="pestana on" data-t="cartas">✉️ Cartas</button><button class="pestana" data-t="snaps">📸 Instantáneas<i id="bSnap"></i></button></div>
    <input id="buscar" type="search" placeholder="Buscar en las cartas…" aria-label="Buscar cartas">
    <div class="filtros" id="filtros"><button class="chip on" data-f="todas">Buzón</button><button class="chip" data-f="destacadas">⭐ Destacadas</button><button class="chip" data-f="archivo">Archivo</button></div>
    <div id="lista"></div>
    <div id="vSnaps" style="display:none;flex-direction:column;gap:12px;flex:1"><div class="muted" id="racha"></div><div class="filtros" id="fSnaps"><button class="chip on" data-s="rec">Recibidas</button><button class="chip" data-s="env">Enviadas</button><button class="chip" data-s="gua">⭐ Guardadas</button></div><div id="gSnaps" class="grid"></div></div>
    <button class="btn" id="irEscribir">Te mando una carta</button>
    <button class="btn" id="irSnap" style="display:none">📸 Mandar instantánea</button>
  </section>
 
  <!-- 3. Redacción -->
  <section class="screen" id="s-escribir">
    <div><label for="para">Para</label><select id="para"></select></div>

/* ---- Pluma compartida (Supabase Broadcast, canal privado por pareja; nada se guarda) ---- */
let plumaCh = null, plumaTmr = null, plumaIdle = null, plumaOk = leer('pw_pluma') !== '0';

function abrirPluma(para){
  cerrarPluma(false);

  const ch = sb.channel(topicPluma(user.id, para), { config:{ private:true, broadcast:{ self:false } } });
  ch.on('broadcast', { event:'estado' }, ({ payload }) => { if (payload.from === para) verPluma(payload); })
    .on('broadcast', { event:'fin' }, ({ payload }) => { if (payload.from === para) ocultarPluma(); })
    .on('broadcast', { event:'hola' }, ({ payload }) => { if (payload.from === para) plumaEnviar('estado', plumaEstado(false)); })
    .subscribe(st => { if (st === 'SUBSCRIBED') plumaEnviar('hola', {}); });
  plumaCh = ch;
}
function cerrarPluma(avisar = true){

  if (plumaCh) { if (avisar) plumaEnviar('fin', {}); const c = plumaCh; plumaCh = null; setTimeout(() => sb.removeChannel(c), 200); }

const fmtDia = (dias, mes, anio) => { const d = new Date(); d.setDate(d.getDate() + dias); if (mes) d.setMonth(d.getMonth() + mes); if (anio) d.setFullYear(d.getFullYear() + anio); return `${d.getFullYear()}-${f2(d.getMonth() + 1)}-${f2(d.getDate())}`; };
function crearLienzo(cv, base, herr){

  b.innerHTML = `<span class="lacre" style="${l.seal_color ? esc('background:radial-gradient(circle at 35% 30%,' + l.seal_color + 'cc,' + l.seal_color + ')') : ''}">🔒</span><div style="flex:1"><b>Carta sellada de ${esc(l.sender_name)}</b><small>Se abre el ${fechaLarga(l.unlock_at)}</small></div>`;
  b.onclick = () => { const d = Math.ceil((new Date(l.unlock_at) - Date.now()) / 864e5); toast(d <= 1 ? 'Se abre mañana' : 'Se abre en ' + d + ' días'); };
  $('#lista').appendChild(b);
}
function programarSello(){
  clearTimeout(tSello); if (!selladas.length) return;
  const ms = new Date(selladas[0].unlock_at) - Date.now() + 1500;
  if (ms < 2147483000) tSello = setTimeout(cargar, Math.max(ms, 1500));
}
setInterval(() => { if (user && profile && !document.hidden) cargar(); }, 60000);
function acuse(l){
  if (!l.read_at || Date.now() - new Date(l.read_at) > 30000 || acusadas.has(l.id)) return;
  acusadas.add(l.id); lluviaPlumas(); toast('🕊️ ' + (nombresU[l.recipient_id] || 'Tu amigo') + ' ya leyó tu carta');
}

/* ---- Configuración ---- */
const COLORES = ['#8e2b1c', '#1f4e79', '#2f6b3a', '#b8862b', '#6b3a8c', '#222222'], SELLOS = ['', '🪶', '❤️', '⭐', '🕊️', '🌙'];
let lacre = { c: COLORES.includes(leer('pw_lc')) ? leer('pw_lc') : COLORES[0], i: SELLOS.includes(leer('pw_li')) ? leer('pw_li') || '' : '' };
function pintarLacre(){
  const mk = (box, lista, clave, fn) => { box.innerHTML = ''; lista.forEach(v => { const b = document.createElement('button'); fn(b, v); b.classList.toggle('on', lacre[clave] === v); b.onclick = () => { lacre[clave] = v; guardar('pw_l' + clave, v); pintarLacre(); }; box.appendChild(b); }); };
  mk($('#opcColor'), COLORES, 'c', (b, v) => { b.style.background = v; b.setAttribute('aria-label', 'Color ' + v); });
  mk($('#opcIcono'), SELLOS, 'i', (b, v) => { b.textContent = v || (profile.name || '?').charAt(0).toUpperCase(); b.style.background = lacre.c; b.style.color = '#f5d9a8'; });
}
$('#btnCfg').onclick = () => { $('#nuevoNombre').value = profile.name; pintarLacre(); show('s-config'); };
$('#volverCfg').onclick = () => show('s-buzon');
$('#guardarNombre').onclick = async () => {
  const n = $('#nuevoNombre').value.trim().slice(0, 30); if (!n) return toast('Escribe un nombre');
  const { error } = await sb.from('profiles').update({ name: n }).eq('id', user.id);
  if (error) return toast('No se pudo cambiar el nombre');
  profile.name = n; pintar(); pintarLacre(); toast('Ahora eres ' + n);
};

/* ---- Administración ---- */
$('#btnAdmin').onclick = async () => { show('s-admin'); await cargarUsuarios(); };
$('#volverAdmin').onclick = () => show('s-buzon');
async function cargarUsuarios(){
  const box = $('#usuarios'); box.innerHTML = '';
  const { data, error } = await sb.rpc('admin_users');
  if (error) return toast('Solo el admin puede ver esto');
  data.forEach(u => {
    const r = document.createElement('div'); r.className = 'usr';
    r.innerHTML = '<div><b></b><small class="c"></small><small class="f"></small></div>';
    r.querySelector('b').textContent = u.name + (u.role === 'admin' ? ' (admin)' : '');
    r.querySelector('.c').textContent = u.email;
    r.querySelector('.f').textContent = 'Desde ' + fecha(u.created_at) + ' · ' + u.letters_received + ' cartas recibidas';
    if (u.id !== user.id) {
      const b = document.createElement('button'); b.className = 'btn suave'; b.textContent = 'Quitar';
      b.onclick = async () => {
        if (!confirm('¿Eliminar a ' + u.name + ' y todas sus cartas?')) return;
        const { error } = await sb.rpc('admin_remove_user', { target: u.id });
        if (error) return toast('No se pudo eliminar'); toast('Usuario eliminado'); cargarUsuarios();
      };
      r.appendChild(b);
    }
    box.appendChild(r);
  });
}
 
/* ---- Avisos push ---- */
const VAPID_PUBLIC = 'BBkPfHuC6MLA0AEZjrFjtwTODVO9uF5Mtg4ZoR8iK85ddEb0dOe2sE0bVPHWm6zaFyKOG-eMXgpvfYH97dBE6XA';
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalada = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const soportaPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
 
const b64 = s => { const r = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
async function obtenerSub(){ if (!soportaPush) return null; const reg = await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
async function guardarSub(sub){
  const j = sub.toJSON();
  const { error } = await sb.rpc('register_push', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  if (error) throw error;
}
async function refrescarAvisos(){
  const b = $('#avisos');
  if (!soportaPush) { b.textContent = 'Activar avisos'; return; }
  try {
    const sub = await obtenerSub();
    if (sub && Notification.permission === 'granted') { await guardarSub(sub); b.textContent = 'Desactivar avisos'; }
    else b.textContent = 'Activar avisos';
  } catch (e) { b.textContent = 'Activar avisos'; }
}
$('#avisos').onclick = async () => {
  if (!soportaPush) {
    return alert(esIOS && !instalada
      ? 'Para recibir avisos en iPhone:\n\n1. Abre esta página en Safari.\n2. Toca Compartir y elige "Agregar a inicio".\n3. Abre Paloma Weka desde el ícono nuevo.\n4. Toca "Activar avisos".\n\nRequiere iOS 16.4 o superior.'
      : 'Este navegador no permite avisos.');
  }
  try {
    const actual = await obtenerSub();
    if (actual && Notification.permission === 'granted') {
      await sb.from('push_subscriptions').delete().eq('endpoint', actual.endpoint);
      await actual.unsubscribe(); toast('Avisos desactivados'); return refrescarAvisos();
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Permiso denegado. Actívalo en Ajustes > Notificaciones');
    const reg = await navigator.serviceWorker.ready;
    const sub = actual || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID_PUBLIC) });
    await guardarSub(sub); toast('Avisos activados'); refrescarAvisos();
  } catch (e) { toast('No se pudieron activar los avisos'); }
};
 
document.addEventListener('visibilitychange', () => { if (!document.hidden && user && profile) { cargar(); cargarSnaps(); } });
