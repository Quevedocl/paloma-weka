<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Paloma Weka</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<!-- Backend: proyecto de Supabase con tablas profiles y letters, RLS y Realtime ya configurados. -->
<style>
:root{
  --madera:#4a3120; --madera2:#33210f; --perg:#ecd9a9; --perg2:#dcc088; --tinta:#3a2716;
  --lacre:#8e2b1c; --lacre2:#b13a26; --sombra:rgba(30,15,5,.45);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(circle at 30% 20%,#5b3d27,var(--madera2));
  font-family:'IM Fell English',Georgia,serif;color:var(--tinta);
  display:flex;justify-content:center;
}
#app{
  position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;
  background:
    radial-gradient(ellipse at 20% 10%,rgba(255,244,210,.55),transparent 55%),
    radial-gradient(ellipse at 90% 95%,rgba(120,80,30,.35),transparent 50%),
    repeating-linear-gradient(97deg,rgba(120,80,30,.05) 0 2px,transparent 2px 7px),
    var(--perg);
  box-shadow:0 0 60px #0008;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
@media(min-width:500px){#app{height:min(900px,96vh);align-self:center;border-radius:28px;border:10px solid var(--madera2)}}
.screen{position:absolute;inset:0;padding:26px 24px;display:none;flex-direction:column;gap:18px;overflow-y:auto}
.screen.on{display:flex}
h1{font-family:'Caveat',cursive;font-size:44px;line-height:1;font-weight:700}
h2{font-family:'Caveat',cursive;font-size:32px;font-weight:700}
p{line-height:1.5;font-size:18px}
.muted{opacity:.7;font-size:16px}
label{font-size:17px;display:block;margin-bottom:6px}
input,textarea{
  width:100%;font:inherit;font-size:20px;color:var(--tinta);background:rgba(255,248,225,.55);
  border:none;border-bottom:2px solid var(--madera);padding:10px 6px;border-radius:4px 4px 0 0;outline:none;
}
input:focus,textarea:focus{background:rgba(255,248,225,.85);border-bottom-color:var(--lacre)}
button{font:inherit;cursor:pointer}
.btn{
  background:var(--lacre);color:#fbeed0;border:none;border-radius:999px;padding:13px 24px;font-size:20px;
  box-shadow:0 3px 0 #5e1a10,0 6px 14px var(--sombra);transition:transform .12s;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5e1a10}
.btn.suave{background:transparent;color:var(--tinta);border:2px solid var(--madera);box-shadow:none}
.link{background:none;border:none;text-decoration:underline;color:var(--tinta);opacity:.7;font-size:15px;align-self:center}
.btn:focus-visible,.link:focus-visible,.carta:focus-visible{outline:3px solid var(--lacre);outline-offset:3px}
.fila{display:flex;gap:12px}
.fila>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.aviso{font-size:14px;background:rgba(142,43,28,.12);border-left:3px solid var(--lacre);padding:8px 10px;border-radius:0 6px 6px 0}

/* Buzón */
#lista{display:flex;flex-direction:column;gap:12px;flex:1}
.carta{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:linear-gradient(160deg,#f3e3b8,#e2c891);border:1px solid #b8955a;border-radius:6px 14px 6px 14px;
  padding:14px 16px;color:var(--tinta);box-shadow:2px 4px 10px var(--sombra);
}
.carta:nth-child(even){transform:rotate(.7deg)}.carta:nth-child(odd){transform:rotate(-.6deg)}
.lacre{
  flex:none;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--lacre2),var(--lacre));
  box-shadow:inset 0 -3px 5px #0004,0 2px 4px #0005;display:grid;place-items:center;color:#f5d9a8;font-family:'Caveat',cursive;font-size:22px;
}
.carta b{font-family:'Caveat',cursive;font-size:26px;display:block;line-height:1}
.carta small{opacity:.7;font-size:14px}
.vacio{margin:auto;text-align:center;opacity:.75}
.vacio svg{width:110px;opacity:.6;margin-bottom:8px}

/* Redacción */
.hoja{
  flex:1;display:flex;flex-direction:column;background:#f6e9c4;border:1px solid #b8955a;border-radius:4px;
  box-shadow:2px 5px 14px var(--sombra);padding:14px 16px;min-height:0;
}
.hoja textarea{
  flex:1;resize:none;border:none;background:transparent;font-family:'Caveat',cursive;font-size:28px;line-height:36px;
  background-image:repeating-linear-gradient(transparent 0 35px,rgba(120,80,30,.28) 35px 36px);
  background-attachment:local;padding:0 2px;
}
.hoja textarea:focus{background-color:transparent}

/* Lectura */
.pergamino{
  flex:1;position:relative;padding:34px 26px 28px;overflow-y:auto;min-height:0;
  background:
    radial-gradient(ellipse at 50% 0,rgba(255,250,230,.7),transparent 60%),
    linear-gradient(#f2e2b4,#e6cd97);
  border-top:14px solid var(--madera);border-bottom:14px solid var(--madera);
  box-shadow:0 8px 20px var(--sombra);
  transform-origin:top;animation:abrir .7s cubic-bezier(.2,.8,.2,1);
}
@keyframes abrir{from{transform:scaleY(.05);opacity:0}to{transform:scaleY(1);opacity:1}}
.pergamino .de{font-family:'Caveat',cursive;font-size:30px;margin-bottom:14px;color:var(--lacre)}
.pergamino .texto{font-family:'Caveat',cursive;font-size:29px;line-height:1.3;white-space:pre-wrap;word-break:break-word}

select{width:100%;font:inherit;font-size:22px;font-family:'Caveat',cursive;color:var(--tinta);background:rgba(255,248,225,.55);border:none;border-bottom:2px solid var(--madera);padding:8px 4px;border-radius:4px 4px 0 0}
.usr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed #b8955a}
.usr>div{flex:1;min-width:0}
.usr b{font-family:'Caveat',cursive;font-size:26px;line-height:1}
.usr small{display:block;opacity:.7;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.usr .btn{padding:7px 14px;font-size:16px;flex:none}
.aviso.ok{background:rgba(60,110,50,.14);border-left-color:#3c6e32}

/* Vuelo */
#vuelo{position:absolute;inset:0;z-index:20;display:none;background:rgba(236,217,169,.9);overflow:hidden}
#vuelo.on{display:block}
#vuelo svg{position:absolute;left:0;bottom:0;width:150px;animation:vuela 2.6s cubic-bezier(.45,.05,.55,.95) forwards}
#vuelo p{position:absolute;bottom:14%;width:100%;text-align:center;font-family:'Caveat',cursive;font-size:32px;animation:aparece 2.6s forwards}
@keyframes vuela{
  0%{transform:translate(-60px,40px) rotate(-8deg) scale(.8)}
  50%{transform:translate(150px,-330px) rotate(-14deg) scale(1)}
  100%{transform:translate(470px,-720px) rotate(-18deg) scale(.6)}
}
@keyframes aparece{0%{opacity:0}25%,70%{opacity:1}100%{opacity:0}}
.ala{transform-origin:52px 50px;animation:aletea .32s ease-in-out infinite alternate}
@keyframes aletea{from{transform:rotate(-16deg) scaleY(1)}to{transform:rotate(14deg) scaleY(.55)}}

#toast{
  position:absolute;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;z-index:30;pointer-events:none;
  background:var(--madera2);color:#f5e3b8;padding:11px 20px;border-radius:999px;font-size:17px;white-space:nowrap;transition:.35s;
}
#toast.on{transform:translate(-50%,0);opacity:1}
@media(prefers-reduced-motion:reduce){#vuelo svg,.ala,.pergamino{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="app">

  <!-- 1. Acceso -->
  <section class="screen" id="s-auth">
    <div style="margin-top:5vh"><h1>Paloma Weka</h1></div>
    <p>Cartas que llegan volando. Se leen y se van.</p>
    <div id="campoNombre" hidden><label for="nombre">Tu nombre</label><input id="nombre" maxlength="30" autocomplete="name"></div>
    <div><label for="email">Correo</label><input id="email" type="email" autocomplete="email" inputmode="email"></div>
    <div><label for="clave">Contraseña</label><input id="clave" type="password" minlength="6" autocomplete="current-password"></div>
    <div class="aviso" id="msg" hidden></div>
    <button class="btn" id="entrar">Entrar</button>
    <button class="link" id="cambiarModo">¿No tienes cuenta? Regístrate</button>
  </section>

  <!-- 2. Buzón -->
  <section class="screen" id="s-buzon">
    <div class="top">
      <div><h1 id="saludo">Buzón</h1><p class="muted" id="sub"></p></div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><button class="link" id="btnAdmin" hidden>Usuarios</button><button class="link" id="salir">Salir</button></div>
    </div>
    <div id="lista"></div>
    <button class="btn" id="irEscribir">Te mando una carta</button>
  </section>

  <!-- 3. Redacción -->
  <section class="screen" id="s-escribir">
    <div><label for="para">Para</label><select id="para"></select></div>
    <div class="hoja"><textarea id="texto" maxlength="1500" placeholder="Escribe aquí…" aria-label="Texto de la carta"></textarea></div>
    <div class="fila">
      <button class="btn suave" id="cancelar">Volver</button>
      <button class="btn" id="enviar">Enviar con la paloma</button>
    </div>
  </section>

  <!-- 4. Lectura -->
  <section class="screen" id="s-leer" style="padding:20px 0">
    <div class="pergamino" id="perg">
      <div class="de" id="de"></div>
      <div class="texto" id="cuerpo"></div>
    </div>
    <div class="fila" style="padding:0 24px">
      <button class="btn suave" id="cerrar">Guardar</button>
      <button class="btn" id="seVa">Se va</button>
    </div>
  </section>

  <!-- 5. Usuarios (admin) -->
  <section class="screen" id="s-admin">
    <h2>Usuarios registrados</h2>
    <div id="usuarios"></div>
    <button class="btn suave" id="volverAdmin" style="margin-top:auto">Volver</button>
  </section>

  <div id="vuelo" aria-hidden="true">
    <svg id="paloma" viewBox="0 0 150 110" fill="none">
      <rect x="126" y="52" width="20" height="14" rx="1.5" fill="#f6e9c4" stroke="#8e2b1c" stroke-width="1.5" transform="rotate(12 136 59)"/>
      <path d="M126 52l10 7 10-7" stroke="#8e2b1c" stroke-width="1.2" transform="rotate(12 136 59)"/>
      <g class="ala"><path d="M52 50C36 18 14 12 6 16c10 6 12 22 30 40z" fill="#8a7a66" stroke="#3a2716" stroke-width="2"/></g>
      <path d="M8 74l-6 10 24-4z" fill="#a8977f" stroke="#3a2716" stroke-width="2"/>
      <ellipse cx="66" cy="66" rx="42" ry="22" fill="#d8ccb8" stroke="#3a2716" stroke-width="2.5"/>
      <circle cx="104" cy="52" r="13" fill="#d8ccb8" stroke="#3a2716" stroke-width="2.5"/>
      <path d="M115 50l14 5-14 5z" fill="#c78b3c" stroke="#3a2716" stroke-width="2"/>
      <circle cx="106" cy="49" r="2.4" fill="#3a2716"/>
      <path d="M50 68c14 8 34 8 50-2" stroke="#3a2716" stroke-width="1.5" opacity=".5"/>
    </svg>
    <p>Tu paloma va en camino…</p>
  </div>
  <div id="toast" role="status"></div>
</div>

<script>
const SUPABASE_URL = 'https://ouwffudalkzycsrfsziw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91d2ZmdWRhbGt6eWNzcmZzeml3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMTM1NzcsImV4cCI6MjEwNTc4OTU3N30.1J7VmvHCiBF_1KbG1krZsFj4e6fhKtQ3b5zMSMCqMPY'; // clave pública (anon)
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);

let user = null, profile = null, letters = [], current = null, lastCount = null, modo = 'login', canal = null;

function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2800); }
const fecha = iso => new Date(iso).toLocaleString('es-CL',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function msg(t, ok){ const m=$('#msg'); m.textContent=t; m.hidden=!t; m.classList.toggle('ok', !!ok); }
function traducir(e){
  if (/already registered/i.test(e)) return 'Ese correo ya está registrado. Inicia sesión.';
  if (/password/i.test(e)) return 'La contraseña debe tener al menos 6 caracteres.';
  if (/invalid.*email|email.*invalid/i.test(e)) return 'Ese correo no es válido.';
  if (/rate limit/i.test(e)) return 'Demasiados intentos. Espera unos minutos.';
  return 'No se pudo completar: ' + e;
}

/* ---- Acceso ---- */
function setModo(m){
  modo = m; msg('');
  $('#campoNombre').hidden = m !== 'registro';
  $('#entrar').textContent = m === 'registro' ? 'Crear mi cuenta' : 'Entrar';
  $('#cambiarModo').textContent = m === 'registro' ? 'Ya tengo cuenta. Iniciar sesión' : '¿No tienes cuenta? Regístrate';
  $('#clave').autocomplete = m === 'registro' ? 'new-password' : 'current-password';
}
$('#cambiarModo').onclick = () => setModo(modo === 'login' ? 'registro' : 'login');
$('#entrar').onclick = async () => {
  const email = $('#email').value.trim(), pass = $('#clave').value, name = $('#nombre').value.trim();
  if (!email || pass.length < 6) return msg('Escribe tu correo y una contraseña de al menos 6 caracteres.');
  const btn = $('#entrar'); btn.disabled = true; msg('');
  try {
    if (modo === 'registro') {
      if (!name) return msg('Escribe tu nombre.');
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name } } });
      if (error) return msg(traducir(error.message));
      if (!data.session) { setModo('login'); return msg('Te enviamos un correo. Confírmalo y luego inicia sesión.', true); }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) return msg(/confirm/i.test(error.message) ? 'Confirma tu correo antes de entrar.' : 'Correo o contraseña incorrectos.');
    }
  } finally { btn.disabled = false; }
};
$('#salir').onclick = () => sb.auth.signOut();

// No hacer llamadas a Supabase dentro del callback: se difieren con setTimeout
sb.auth.onAuthStateChange((ev, session) => {
  if (session && session.user) {
    if (!user || user.id !== session.user.id) { user = session.user; setTimeout(iniciar, 0); }
  } else {
    user = null; profile = null; letters = [];
    if (canal) { sb.removeChannel(canal); canal = null; }
    $('#clave').value = ''; show('s-auth');
  }
});
sb.auth.getSession().then(({ data }) => { if (!data.session) show('s-auth'); });

/* ---- Inicio ---- */
async function iniciar(){
  for (let i = 0; i < 3 && !profile; i++) {
    const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    profile = data; if (!profile) await new Promise(r => setTimeout(r, 700));
  }
  if (!profile) { toast('No se pudo cargar tu perfil'); return sb.auth.signOut(); }
  $('#btnAdmin').hidden = profile.role !== 'admin';
  lastCount = null; show('s-buzon'); await cargar(); suscribir();
}
function suscribir(){
  if (canal) sb.removeChannel(canal);
  canal = sb.channel('cartas-' + user.id)
    .on('postgres_changes', { event:'*', schema:'public', table:'letters', filter:'recipient_id=eq.' + user.id }, () => cargar())
    .subscribe();
}

/* ---- Buzón ---- */
async function cargar(){
  const { data, error } = await sb.from('letters').select('*')
    .eq('recipient_id', user.id).eq('dismissed', false).order('timestamp', { ascending:false });
  if (error) return toast('No se pudieron cargar las cartas');
  letters = data;
  if (lastCount !== null && letters.length > lastCount) toast('Llegó una paloma con una carta');
  lastCount = letters.length;
  pintar();
}
function pintar(){
  $('#saludo').textContent = 'Hola, ' + profile.name;
  $('#sub').textContent = letters.length ? (letters.length === 1 ? 'Tienes 1 carta sin archivar' : `Tienes ${letters.length} cartas sin archivar`) : '';
  const box = $('#lista'); box.innerHTML = '';
  if (!letters.length) {
    box.innerHTML = '<div class="vacio"><svg viewBox="0 0 150 110" fill="none"><ellipse cx="66" cy="66" rx="42" ry="22" stroke="#3a2716" stroke-width="3"/><circle cx="104" cy="52" r="13" stroke="#3a2716" stroke-width="3"/><path d="M115 50l14 5-14 5z" stroke="#3a2716" stroke-width="3"/></svg><p>El buzón está vacío.<br>Cuando alguien te escriba, la paloma llegará aquí.</p></div>';
    return;
  }
  letters.forEach(l => {
    const b = document.createElement('button');
    b.className = 'carta';
    b.innerHTML = '<span class="lacre"></span><span><b></b><small></small></span>';
    b.querySelector('.lacre').textContent = (l.sender_name || '?').charAt(0).toUpperCase();
    b.querySelector('b').textContent = 'Carta de ' + l.sender_name;
    b.querySelector('small').textContent = fecha(l.timestamp);
    b.onclick = () => abrir(l);
    box.appendChild(b);
  });
}
function abrir(l){
  current = l;
  $('#de').textContent = 'De parte de ' + l.sender_name;
  $('#cuerpo').textContent = l.text;
  const p = $('#perg'); p.style.animation = 'none'; void p.offsetWidth; p.style.animation = '';
  show('s-leer');
}
$('#cerrar').onclick = () => show('s-buzon');
$('#seVa').onclick = async () => {
  if (!current) return;
  const { error } = await sb.from('letters').update({ dismissed:true }).eq('id', current.id);
  if (error) return toast('No se pudo archivar');
  current = null; show('s-buzon'); await cargar(); toast('La carta se fue volando');
};

/* ---- Redacción ---- */
$('#irEscribir').onclick = async () => {
  const { data, error } = await sb.from('profiles').select('id,name').neq('id', user.id).order('name');
  if (error) return toast('No se pudo cargar la lista');
  if (!data.length) return toast('Aún no hay nadie más registrado');
  const sel = $('#para'); sel.innerHTML = '';
  data.forEach(u => { const o = document.createElement('option'); o.value = u.id; o.textContent = u.name; sel.appendChild(o); });
  $('#texto').value = ''; show('s-escribir'); setTimeout(() => $('#texto').focus(), 50);
};
$('#cancelar').onclick = () => show('s-buzon');
$('#enviar').onclick = async () => {
  const text = $('#texto').value.trim(), to = $('#para').value;
  if (!text) return toast('Escribe algo antes de enviar');
  const btn = $('#enviar'); btn.disabled = true;
  const { error } = await sb.from('letters').insert({ recipient_id: to, text });
  if (error) { btn.disabled = false; return toast('No se pudo enviar. Intenta de nuevo'); }
  const v = $('#vuelo'), svg = $('#paloma');
  v.classList.add('on'); svg.style.animation = 'none'; void svg.getBoundingClientRect(); svg.style.animation = '';
  setTimeout(() => { v.classList.remove('on'); btn.disabled = false; show('s-buzon'); toast('La paloma ya salió'); }, 2700);
};

/* ---- Administración ---- */
$('#btnAdmin').onclick = async () => { show('s-admin'); await cargarUsuarios(); };
$('#volverAdmin').onclick = () => show('s-buzon');
async function cargarUsuarios(){
  const box = $('#usuarios'); box.innerHTML = '';
  const { data, error } = await sb.rpc('admin_users');
  if (error) return toast('Solo el admin puede ver esto');
  data.forEach(u => {
    const r = document.createElement('div'); r.className = 'usr';
    r.innerHTML = '<div><b></b><small class="c"></small><small class="f"></small></div>';
    r.querySelector('b').textContent = u.name + (u.role === 'admin' ? ' (admin)' : '');
    r.querySelector('.c').textContent = u.email;
    r.querySelector('.f').textContent = 'Desde ' + fecha(u.created_at) + ' · ' + u.letters_received + ' cartas recibidas';
    if (u.id !== user.id) {
      const b = document.createElement('button'); b.className = 'btn suave'; b.textContent = 'Quitar';
      b.onclick = async () => {
        if (!confirm('¿Eliminar a ' + u.name + ' y todas sus cartas?')) return;
        const { error } = await sb.rpc('admin_remove_user', { target: u.id });
        if (error) return toast('No se pudo eliminar'); toast('Usuario eliminado'); cargarUsuarios();
      };
      r.appendChild(b);
    }
    box.appendChild(r);
  });
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && user && profile) cargar(); });
</script>
</body>
</html>
